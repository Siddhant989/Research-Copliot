<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ResearchPilot AI{% endblock %}</title>

  <!-- TailwindCSS via CDN — no build step needed for the hackathon -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- marked.js — converts Markdown → HTML so the synthesis renders nicely -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Chart.js — for repro score bar chart and publication timeline -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Prism.js — syntax highlighting for the generated code snippet -->
  <link  href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>

  <style>
    /* Custom scrollbar so the dark theme looks polished */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="h-full text-gray-100 font-sans antialiased">

  <!-- ── Top Navigation Bar ─────────────────────────────────────────── -->
  <nav class="fixed top-0 inset-x-0 z-50 bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center gap-3">
    <span class="text-indigo-400 text-xl font-bold tracking-tight">ResearchPilot</span>
    <span class="text-gray-500 text-xl font-light">AI</span>
    <span class="ml-2 text-xs bg-indigo-900 text-indigo-300 px-2 py-0.5 rounded-full">
      Hackathon Demo
    </span>

    <!-- Spacer pushes Demo button to the right -->
    <div class="flex-1"></div>

    <!--
      DEMO BUTTON — click this during live presentations.
      Loads pre-built "Attention Is All You Need" results instantly.
      No Gemini API key needed.
    -->
    <button
      id="demo-btn"
      title="Load pre-built demo results for 'Attention Is All You Need' (no API call)"
      class="flex items-center gap-2 bg-amber-500 hover:bg-amber-400 active:bg-amber-600
             text-gray-950 font-bold text-sm px-4 py-1.5 rounded-xl
             transition-colors shadow-lg shadow-amber-900/40
             disabled:opacity-60 disabled:cursor-not-allowed">
      <span>▶</span>
      <span>Run Demo</span>
    </button>
  </nav>

  <!-- ── Page Content (pushed below the fixed nav) ─────────────────── -->
  <main class="pt-14 min-h-full">
    {% block content %}{% endblock %}
  </main>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
